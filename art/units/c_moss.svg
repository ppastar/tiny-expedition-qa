<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 352" data-ppu="176" data-neck="144 244" stroke-linejoin="round" stroke-linecap="round">
  <!-- 이끼 방패병: 이끼처럼 폭신한 초록 단발, 머리 위 새싹, 청록 갑옷, 잎 무늬 나무 방패 -->
  <defs>
    <linearGradient id="irisG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#124a34"/><stop offset=".55" stop-color="#2f8a5e"/><stop offset="1" stop-color="#9be0a8"/></linearGradient>
    <radialGradient id="shieldG" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#c08a54"/><stop offset=".6" stop-color="#9a6a3c"/><stop offset="1" stop-color="#7a5030"/></radialGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b4e884"/><stop offset="1" stop-color="#6fbf52"/></linearGradient>
    <path id="tunic" d="M118 240 C106 258 102 282 102 302 C120 311 168 311 186 302 C186 282 182 258 170 240 C160 234 128 234 118 240 Z"/>
    <path id="face" d="M82 182 C82 142 110 124 144 124 C178 124 206 142 206 182 C206 216 180 242 144 242 C108 242 82 216 82 182Z"/>
    <path id="bang" d="M80 192 C74 148 98 119 144 119 C190 119 214 148 208 192 C200 192 194 186 190 177 C182 187 168 189 158 183 C150 191 134 191 126 183 C116 189 102 187 98 177 C94 186 88 192 80 192 Z"/>
    <path id="backhair" d="M72 182 C66 136 98 110 144 110 C190 110 222 136 216 182 C220 204 214 224 204 236 C198 244 188 242 184 234 C178 242 166 242 162 234 L126 234 C122 242 110 242 104 234 C100 242 90 244 84 236 C74 224 68 204 72 182Z"/>
    <path id="boot" d="M121 314 h22 v15 a7 7 0 0 1 -7 7 h-15 a7 7 0 0 1 -7 -7 v-1 a10 10 0 0 1 7 -14z"/>
    <clipPath id="c-tunic"><use href="#tunic"/></clipPath>
    <clipPath id="c-face"><use href="#face"/></clipPath>
    <clipPath id="c-bang"><use href="#bang"/></clipPath>
    <clipPath id="c-back"><use href="#backhair"/></clipPath>
    <clipPath id="c-shield"><circle cx="100" cy="284" r="40"/></clipPath>
    <g id="eye">
