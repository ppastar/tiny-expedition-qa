      <ellipse cy="9.5" rx="6" ry="3" fill="#d6ffd0" opacity=".7"/>
      <circle cx="-4.2" cy="-6" r="4.2" fill="#fff"/><circle cx="4.6" cy="6.5" r="2" fill="#fff"/>
    </g>
    <!-- 처진 눈매: 바깥쪽 끝이 내려간다 -->
    <g id="lash">
      <path d="M-18 0 C-17 -14 -4 -20 8 -17 C12 -16 15 -13 16 -9 C8 -14 -6 -13 -13 -5 C-14 -3 -16 -1 -18 0 Z" fill="#2c3a30"/>
      <path d="M-8 15 q8 3 16 0" fill="none" stroke="#a8644e" stroke-width="1.6"/>
    </g>
  </defs>

  <g id="L-back">
    <g transform="translate(144 244) scale(1.22) translate(-144 -244)">
