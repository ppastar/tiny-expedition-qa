        <use href="#eye" transform="translate(170 202)"/>
        <use href="#lash" transform="translate(118 202)"/>
        <use href="#lash" transform="translate(170 202) scale(-1 1)"/>
      </g>
      <g id="eyes-closed" display="none">
        <path d="M104 200 Q118 212 132 204 M184 200 Q170 212 156 204" fill="none" stroke="#2c3a30" stroke-width="4.6"/>
      </g>
      <!-- 볼·입 -->
      <ellipse cx="98" cy="220" rx="11" ry="6" fill="#ff8fa3" opacity=".5"/>
      <ellipse cx="190" cy="220" rx="11" ry="6" fill="#ff8fa3" opacity=".5"/>
      <path d="M92 222 l3 -5 M97 223 l3 -5 M102 223 l3 -5 M184 223 l3 -5 M189 223 l3 -5 M194 222 l3 -5" stroke="#e86a84" stroke-width="1.4" fill="none"/>
      <path d="M137 221 Q144 227 151 221" fill="none" stroke="#a8475a" stroke-width="2.8"/>
