      <path d="M82 174 C68 198 72 228 90 240 C100 228 100 200 96 178 Z" fill="#74b66e" stroke="#2f5a34" stroke-width="3.4"/>
      <path d="M206 174 C220 198 216 228 198 240 C188 228 188 200 192 178 Z" fill="#62a260" stroke="#2f5a34" stroke-width="3.4"/>
      <use href="#bang" fill="#78ba72"/>
      <g clip-path="url(#c-bang)">
        <path d="M150 120 C196 128 218 160 212 200 L226 200 L226 120Z" fill="#62a260"/>
        <path d="M96 150 C104 138 118 132 134 130" fill="none" stroke="#b4e8a0" stroke-width="7" opacity=".55"/>
      </g>
      <use href="#bang" fill="none" stroke="#2f5a34" stroke-width="3.4"/>
      <!-- 이끼 알갱이 -->
      <g fill="#a8dc8a">
        <circle cx="112" cy="160" r="3.4"/><circle cx="168" cy="148" r="3"/><circle cx="188" cy="168" r="3.4"/><circle cx="136" cy="146" r="2.4"/><circle cx="84" cy="206" r="2.6"/><circle cx="204" cy="212" r="2.6"/>
      </g>
      <path d="M126 183 C124 176 124 170 126 164 M158 183 C160 176 160 170 158 164" fill="none" stroke="#4a8450" stroke-width="2"/>
      <!-- 새싹 -->
      <path d="M146 130 C144 118 146 106 152 96" fill="none" stroke="#2f5a34" stroke-width="7"/>
      <path d="M146 130 C144 118 146 106 152 96" fill="none" stroke="#6fbf52" stroke-width="3.4"/>
      <path d="M152 98 C140 82 122 78 110 86 C116 102 136 108 152 98Z" fill="#8fd16a" stroke="#3f7a2f" stroke-width="3.4"/>
      <path d="M150 97 C138 92 126 88 114 87" fill="none" stroke="#3f7a2f" stroke-width="1.8"/>
      <path d="M152 96 C160 70 188 60 206 70 C202 92 178 104 152 96Z" fill="url(#leafG)" stroke="#3f7a2f" stroke-width="3.4"/>
      <path d="M154 95 C170 86 186 78 202 72 M170 88 l-2 -8 M184 82 l-2 -8 M174 86 l8 4" fill="none" stroke="#3f7a2f" stroke-width="1.8"/>
    </g>
  </g>
</svg>
