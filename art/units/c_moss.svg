      <path d="M100 240 C134 250 146 290 126 326 L150 326 L150 240Z" fill="#5e3a1c" opacity=".28"/>
    </g>
    <circle cx="100" cy="284" r="40" fill="none" stroke="#4e2c14" stroke-width="4.6"/>
