    <path d="M82 306 C76 284 90 262 118 260 C124 282 110 304 82 306Z" fill="url(#leafG)" stroke="#3f7a2f" stroke-width="3.2"/>
    <path d="M84 304 C94 290 106 274 117 262 M96 290 l-8 -4 M104 280 l-7 -6 M100 286 l10 2 M108 276 l8 0" fill="none" stroke="#3f7a2f" stroke-width="2"/>
    <circle cx="100" cy="248" r="2.6" fill="#d9c08a"/><circle cx="100" cy="320" r="2.6" fill="#d9c08a"/><circle cx="64" cy="284" r="2.6" fill="#d9c08a"/><circle cx="136" cy="284" r="2.6" fill="#d9c08a"/>
    <path d="M70 268 C74 258 82 252 90 250" fill="none" stroke="#fff" stroke-width="4" opacity=".4"/>
    <!-- 깃 -->
    <path d="M118 242 C130 252 158 252 170 242 C170 252 160 260 144 260 C128 260 118 252 118 242Z" fill="#cfe8a0" stroke="#5f7a3a" stroke-width="3.2"/>
  </g>

  <g id="L-head">
