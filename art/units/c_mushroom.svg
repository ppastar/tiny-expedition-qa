    <path id="bang" d="M80 188 C74 152 96 130 144 128 C192 130 214 152 208 188 C204 178 198 170 190 164 C190 176 184 184 174 188 C176 176 172 166 164 158 C158 172 146 180 130 184 C134 174 134 166 132 158 C122 170 108 176 94 176 C90 182 86 186 80 188 Z"/>
