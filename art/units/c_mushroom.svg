        <path d="M82 214 C104 246 184 246 206 214 V250 H82Z" fill="#f9d2bd" opacity=".7"/>
      </g>
      <use href="#face" fill="none" stroke="#a8644e" stroke-width="4"/>
      <g id="eyes-open">
        <use href="#eye" transform="translate(119 198)"/>
        <use href="#eye" transform="translate(169 198)"/>
        <use href="#lash" transform="translate(119 198)"/>
        <use href="#lash" transform="translate(169 198) scale(-1 1)"/>
      </g>
      <g id="eyes-closed" display="none">
        <use href="#lid" transform="translate(119 202)"/>
        <use href="#lid" transform="translate(169 202) scale(-1 1)"/>
      </g>
      <!-- 볼·입 -->
      <ellipse cx="99" cy="216" rx="11" ry="6" fill="#ff8fa3" opacity=".5"/>
      <ellipse cx="189" cy="216" rx="11" ry="6" fill="#ff8fa3" opacity=".5"/>
      <path d="M93 218 l3 -5 M98 219 l3 -5 M103 219 l3 -5 M183 219 l3 -5 M188 219 l3 -5 M193 218 l3 -5" stroke="#e86a84" stroke-width="1.4" fill="none"/>
      <path d="M136 218 Q144 231 152 218 Z" fill="#d9546e" stroke="#8a2f45" stroke-width="1.8"/>
      <path d="M140 224 Q144 221 148 224 Q144 229 140 224Z" fill="#ff9aa8"/>
      <!-- 옆머리·앞머리 -->
