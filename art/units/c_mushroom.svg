    <path d="M107 277 C124 284 164 284 181 277" fill="none" stroke="#a8413c" stroke-width="7"/>
    <rect x="137" y="273" width="14" height="12" rx="3" fill="#ffd166" stroke="#8a5a1e" stroke-width="2"/>
    <circle cx="144" cy="261" r="3.4" fill="#e0584f" stroke="#7a2530" stroke-width="1.5"/>
