    <linearGradient id="irisG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e1826"/><stop offset=".55" stop-color="#d64848"/><stop offset="1" stop-color="#ffa07c"/></linearGradient>
    <linearGradient id="potG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb3cb"/><stop offset="1" stop-color="#f0608f"/></linearGradient>
    <path id="cap" d="M40 132 C34 74 86 30 146 30 C206 30 254 76 248 132 C246 146 214 151 144 151 C74 151 42 146 40 132 Z"/>
    <path id="robe" d="M118 240 C108 262 100 288 96 306 C112 317 176 317 192 306 C188 288 180 262 170 240 C160 234 128 234 118 240 Z"/>
