        <path d="M150 170 C176 220 178 280 166 320 L230 320 L226 170Z" fill="#d6c8b9"/>
        <path d="M92 230 C88 262 90 286 96 304 M196 228 C200 258 198 284 192 304 M112 250 C110 276 112 292 116 304" fill="none" stroke="#bfb0a1" stroke-width="2"/>
      </g>
    </g>
  </g>

  <g id="L-body">
