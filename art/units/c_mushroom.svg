    <path d="M242 226 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5z" fill="#fff6c2" stroke="#e0a83a" stroke-width="1.2"/>
    <!-- 오른팔 -->
    <path d="M166 242 C184 246 198 256 207 270 C203 277 197 281 190 281 C184 271 174 263 160 258 Z" fill="#fff8ef" stroke="#86644f" stroke-width="4"/>
    <path d="M193 280 C198 277 203 273 205 268" fill="none" stroke="#e0584f" stroke-width="5"/>
    <circle cx="203" cy="279" r="8.5" fill="#ffe3cf" stroke="#a8644e" stroke-width="3.2"/>
    <!-- 리본 -->
    <path d="M144 248 l-17 -9 q-4 9 0 18z M144 248 l17 -9 q4 9 0 18z" fill="#e0584f" stroke="#7a2530" stroke-width="3.2"/>
    <circle cx="144" cy="248" r="4.5" fill="#f27a6c" stroke="#7a2530" stroke-width="2"/>
