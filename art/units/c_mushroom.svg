    <circle cx="104" cy="294" r="8.5" fill="#ffe3cf" stroke="#a8644e" stroke-width="3.2"/>
    <!-- 물약 -->
    <rect x="210" y="231" width="12" height="16" rx="2" fill="#dff2fa" stroke="#4f6f86" stroke-width="3.2"/>
    <rect x="208" y="224" width="16" height="9" rx="3" fill="#b07a48" stroke="#5e3d1e" stroke-width="3.2"/>
