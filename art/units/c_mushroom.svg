      <use href="#lock" fill="#f1e7db" stroke="#8a7667" stroke-width="4" transform="translate(288 0) scale(-1 1)"/>
      <use href="#bang" fill="#fbf5ec"/>
      <g clip-path="url(#c-bang)">
        <path d="M70 120 H218 V160 C190 170 98 170 70 160Z" fill="#d9ccbe"/>
        <path d="M170 150 C190 160 206 174 210 190 L220 150Z" fill="#e6dbce"/>
      </g>
      <use href="#bang" fill="none" stroke="#8a7667" stroke-width="4"/>
      <path d="M112 156 C110 164 104 171 98 174 M150 154 C150 164 146 173 139 178 M183 158 C185 168 183 176 179 183" fill="none" stroke="#b5a595" stroke-width="1.8"/>
      <!-- 버섯 모자 -->
      <g transform="translate(144 150) rotate(-5) scale(.9) translate(-144 -150)">
        <ellipse cx="144" cy="146" rx="101" ry="13" fill="#ffeedd" stroke="#86644f" stroke-width="4"/>
        <path d="M70 148 l-4 6 M96 152 l-2 6 M124 154 l-1 6 M152 154 l1 6 M180 153 l2 6 M208 150 l4 6" stroke="#d9bfa8" stroke-width="2" fill="none"/>
        <use href="#cap" fill="url(#capG)"/>
        <g clip-path="url(#c-cap)">
          <path d="M30 116 C84 142 206 142 258 116 V170 H30Z" fill="#a82a36" opacity=".45"/>
          <g fill="#f1d6cc"><ellipse cx="94" cy="95" rx="17" ry="13" transform="rotate(-22 94 95)"/><ellipse cx="152" cy="65" rx="19" ry="12"/><ellipse cx="208" cy="103" rx="14" ry="11" transform="rotate(24 208 103)"/><ellipse cx="129" cy="124" rx="10" ry="6"/><ellipse cx="183" cy="130" rx="8" ry="5"/><ellipse cx="52" cy="128" rx="11" ry="8"/></g>
          <g fill="#fffaf5"><ellipse cx="93" cy="92" rx="17" ry="13" transform="rotate(-22 93 92)"/><ellipse cx="151" cy="62" rx="19" ry="12"/><ellipse cx="207" cy="100" rx="14" ry="11" transform="rotate(24 207 100)"/><ellipse cx="128" cy="122" rx="10" ry="6"/><ellipse cx="182" cy="128" rx="8" ry="5"/><ellipse cx="51" cy="126" rx="11" ry="8"/></g>
          <path d="M64 92 C76 64 100 46 128 40" fill="none" stroke="#fff" stroke-width="7" opacity=".38"/>
        </g>
        <use href="#cap" fill="none" stroke="#7a2530" stroke-width="5"/>
      </g>
    </g>
  </g>
</svg>
