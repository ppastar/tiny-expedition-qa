      <ellipse cy="9.5" rx="6" ry="3.2" fill="#ffd0b0" opacity=".75"/>
      <circle cx="-4.2" cy="-7" r="4.4" fill="#fff"/><circle cx="4.6" cy="6" r="2" fill="#fff"/>
