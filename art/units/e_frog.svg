<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" data-ppu="165" stroke-linejoin="round" stroke-linecap="round">
  <!-- 개구리: 연두색 넓적한 몸, 툭 튀어나온 눈, 크림색 배 -->
  <defs>
    <radialGradient id="frogG" cx="38%" cy="22%" r="90%"><stop offset="0" stop-color="#a6e87a"/><stop offset=".6" stop-color="#7fcf5a"/><stop offset="1" stop-color="#58a843"/></radialGradient>
    <path id="bodyShape" d="M160 98 C232 98 280 138 280 190 C280 234 234 258 160 258 C86 258 40 234 40 190 C40 138 88 98 160 98 Z"/>
    <clipPath id="c-body"><use href="#bodyShape"/></clipPath>
    <clipPath id="c-eyeL"><circle cx="104" cy="82" r="26"/></clipPath>
    <clipPath id="c-eyeR"><circle cx="216" cy="82" r="26"/></clipPath>
    <g id="hind">
      <ellipse cx="52" cy="214" rx="38" ry="30" transform="rotate(-24 52 214)" fill="#62b04a" stroke="#2a5a26" stroke-width="5"/>
      <path d="M22 246 C18 256 26 264 38 262 L92 262 C98 256 92 248 84 248 Z" fill="#6cbc50" stroke="#2a5a26" stroke-width="4.6"/>
      <path d="M40 262 v-8 M58 262 v-9" fill="none" stroke="#2a5a26" stroke-width="2.6"/>
    </g>
    <g id="arm">
      <path d="M104 204 C98 224 98 240 96 250 C96 258 132 258 132 250 C130 240 130 224 128 206 Z" fill="#7fcf5a" stroke="#2a5a26" stroke-width="4.6"/>
      <g fill="#8fd96a" stroke="#2a5a26" stroke-width="3.2"><circle cx="97" cy="256" r="7.500"/><circle cx="114" cy="259" r="7.500"/><circle cx="131" cy="256" r="7.500"/></g>
    </g>
  </defs>

  <g id="L-body">
    <use href="#hind"/><use href="#hind" transform="translate(320 0) scale(-1 1)"/>
    <!-- 눈두덩 -->
    <circle cx="104" cy="84" r="40" fill="#7fcf5a" stroke="#2a5a26" stroke-width="5"/>
    <circle cx="216" cy="84" r="40" fill="#7fcf5a" stroke="#2a5a26" stroke-width="5"/>
    <!-- 몸 -->
    <use href="#bodyShape" fill="url(#frogG)"/>
    <g clip-path="url(#c-body)">
      <path d="M30 196 C80 262 240 262 290 186 V270 H30Z" fill="#3f8a3a" opacity=".4"/>
      <ellipse cx="160" cy="226" rx="82" ry="46" fill="#f3f7c8"/>
      <path d="M96 216 C120 196 200 196 224 216" fill="none" stroke="#dfe6a8" stroke-width="3"/>
      <g fill="#58a843"><circle cx="150" cy="116" r="7"/><circle cx="176" cy="124" r="5"/><circle cx="252" cy="176" r="8"/><circle cx="64" cy="170" r="6"/><circle cx="240" cy="204" r="5"/></g>
      <path d="M64 150 C78 124 104 110 130 106" fill="none" stroke="#fff" stroke-width="7" opacity=".28"/>
    </g>
    <use href="#bodyShape" fill="none" stroke="#2a5a26" stroke-width="5"/>
    <!-- 몸 윤곽이 눈두덩 안을 가로지르지 않게 덮는다 -->
    <circle cx="104" cy="86" r="36" fill="#86d460"/><circle cx="216" cy="86" r="36" fill="#86d460"/>
    <path d="M78 66 C84 54 96 48 108 48 M190 66 C196 54 208 48 220 48" fill="none" stroke="#fff" stroke-width="5" opacity=".35"/>
    <g id="eyes-open">
      <circle cx="104" cy="82" r="26" fill="#fff" stroke="#2a5a26" stroke-width="4"/>
      <circle cx="216" cy="82" r="26" fill="#fff" stroke="#2a5a26" stroke-width="4"/>
      <ellipse cx="108" cy="86" rx="11" ry="16" fill="#2b2238"/><ellipse cx="212" cy="86" rx="11" ry="16" fill="#2b2238"/>
      <circle cx="103" cy="78" r="5" fill="#fff"/><circle cx="207" cy="78" r="5" fill="#fff"/>
      <circle cx="112" cy="94" r="2.4" fill="#fff"/><circle cx="216" cy="94" r="2.4" fill="#fff"/>
      <!-- 반쯤 내려온 눈꺼풀 -->
      <g clip-path="url(#c-eyeL)"><path d="M70 50 H140 V78 L70 62Z" fill="#62b04a" stroke="#2a5a26" stroke-width="4"/></g>
      <g clip-path="url(#c-eyeR)"><path d="M250 50 H180 V78 L250 62Z" fill="#62b04a" stroke="#2a5a26" stroke-width="4"/></g>
      <circle cx="104" cy="82" r="26" fill="none" stroke="#2a5a26" stroke-width="4"/>
      <circle cx="216" cy="82" r="26" fill="none" stroke="#2a5a26" stroke-width="4"/>
    </g>
    <g id="eyes-closed" display="none">
      <circle cx="104" cy="82" r="26" fill="#62b04a" stroke="#2a5a26" stroke-width="4"/>
      <circle cx="216" cy="82" r="26" fill="#62b04a" stroke="#2a5a26" stroke-width="4"/>
      <path d="M82 88 Q104 100 126 88 M194 88 Q216 100 238 88" fill="none" stroke="#2a5a26" stroke-width="4.6"/>
    </g>
    <!-- 콧구멍·입·볼 -->
    <ellipse cx="150" cy="146" rx="3" ry="4" fill="#2a5a26"/><ellipse cx="170" cy="146" rx="3" ry="4" fill="#2a5a26"/>
    <ellipse cx="72" cy="188" rx="14" ry="8" fill="#ff8fa3" opacity=".5"/><ellipse cx="248" cy="188" rx="14" ry="8" fill="#ff8fa3" opacity=".5"/>
    <path d="M86 170 C92 180 124 190 160 190 C196 190 228 180 234 170" fill="none" stroke="#2a5a26" stroke-width="5"/>
    <path d="M86 170 l-8 -3 M234 170 l8 -3" fill="none" stroke="#2a5a26" stroke-width="4"/>
    <use href="#arm"/><use href="#arm" transform="translate(320 0) scale(-1 1)"/>
  </g>
</svg>
