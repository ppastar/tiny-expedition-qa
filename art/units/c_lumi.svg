<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 352" data-ppu="176" data-neck="144 244" stroke-linejoin="round" stroke-linecap="round">
  <!-- 달빛 마법사 루미: 연보라 긴 곱슬머리, 남색 마녀 모자(금색 띠·초승달), 보라 로브와 망토, 달 지팡이 -->
  <defs>
    <linearGradient id="hatG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a50a8"/><stop offset=".6" stop-color="#3b3478"/><stop offset="1" stop-color="#2a2458"/></linearGradient>
    <linearGradient id="irisG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2478"/><stop offset=".55" stop-color="#7a5ad8"/><stop offset="1" stop-color="#d9b8ff"/></linearGradient>
    <linearGradient id="robeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5fd6"/><stop offset="1" stop-color="#5a41b0"/></linearGradient>
    <radialGradient id="glowG"><stop offset="0" stop-color="#fff3b0" stop-opacity=".85"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient>
    <path id="face" d="M82 182 C82 142 110 124 144 124 C178 124 206 142 206 182 C206 216 180 242 144 242 C108 242 82 216 82 182Z"/>
    <path id="bang" d="M80 190 C74 154 96 130 144 128 C192 130 214 154 208 190 C204 182 200 176 194 172 C180 172 160 166 146 152 C140 168 126 180 106 184 C108 178 108 172 106 168 C100 178 90 186 80 190Z"/>
    <path id="backhair" d="M78 170 C58 214 54 262 66 300 C60 306 54 306 50 302 C52 316 66 322 78 316 C84 324 96 324 102 314 C110 322 120 320 124 310 L164 310 C168 320 178 322 186 314 C192 324 204 324 210 316 C222 322 236 316 238 302 C234 306 228 306 222 300 C234 262 230 214 210 170Z"/>
    <path id="lock" d="M84 172 C70 204 72 236 84 258 C80 264 76 264 72 262 C76 274 90 276 96 264 C100 240 100 208 98 178Z"/>
    <path id="cone" d="M94 148 C102 112 120 78 148 54 C166 40 190 44 202 62 C188 58 178 64 174 76 C184 100 192 124 196 148 Z"/>
    <path id="robe" d="M120 240 C108 264 98 292 92 314 C112 324 176 324 196 314 C190 292 180 264 168 240 C158 234 130 234 120 240Z"/>
    <path id="cape" d="M112 240 C92 266 78 296 74 322 C84 316 92 318 98 326 L190 326 C196 318 204 316 214 322 C210 296 196 266 176 240Z"/>
    <path id="boot" d="M122 318 h20 v11 a7 7 0 0 1 -7 7 h-13 a7 7 0 0 1 -7 -7 v-1 a9 9 0 0 1 7 -10z"/>
    <clipPath id="c-face"><use href="#face"/></clipPath>
    <clipPath id="c-bang"><use href="#bang"/></clipPath>
    <clipPath id="c-back"><use href="#backhair"/></clipPath>
    <clipPath id="c-cone"><use href="#cone"/></clipPath>
    <clipPath id="c-robe"><use href="#robe"/></clipPath>
    <g id="eye">
      <ellipse rx="12.5" ry="15" fill="#fff"/>
      <ellipse cy="1.5" rx="11" ry="13.5" fill="url(#irisG)"/>
      <ellipse cy="1" rx="5" ry="7" fill="#22124a"/>
      <path d="M0 6 l1.6 3.4 l3.6 .4 l-2.7 2.4 l.8 3.6 l-3.3 -1.9 l-3.3 1.9 l.8 -3.6 l-2.7 -2.4 l3.6 -.4z" fill="#ffe27a" opacity=".9" transform="scale(.6) translate(0 6)"/>
      <circle cx="-4.2" cy="-5" r="4" fill="#fff"/><circle cx="5" cy="5" r="1.8" fill="#fff"/>
    </g>
    <g id="lash">
      <!-- 반쯤 내려온 눈꺼풀: 나른한 표정 -->
      <path d="M-16 -3 C-12 -12 10 -13 15 -6 L15 -16 L-16 -16Z" fill="#f6ccb5"/>
      <path d="M-18 -1 C-12 -12 10 -13 16 -5 C9 -9 -8 -9 -13 -4 C-14 -2 -16 -1 -18 -1 Z M15 -6 l5 -4 M12 -9 l3 -5" fill="#3a2a52" stroke="#3a2a52" stroke-width="1.6"/>
      <path d="M-8 15 q8 3 16 0" fill="none" stroke="#a8644e" stroke-width="1.6"/>
    </g>
    <g id="lid">
      <path d="M-14 2 Q0 10 14 2" fill="none" stroke="#3a2a52" stroke-width="5"/>
      <path d="M14 2 l5 -3 M10 6 l3 4" fill="none" stroke="#3a2a52" stroke-width="2.4"/>
    </g>
    <path id="star" d="M0 -6 l1.8 4.2 l4.4 .4 l-3.3 3 l1 4.4 l-3.9 -2.3 l-3.9 2.3 l1 -4.4 l-3.3 -3 l4.4 -.4z"/>
  </defs>

  <g id="L-back">
    <g transform="translate(144 244) scale(1.18) translate(-144 -244)">
      <use href="#backhair" fill="#b9a2f0" stroke="#5d4a96" stroke-width="4.6"/>
      <g clip-path="url(#c-back)">
        <path d="M150 170 C180 220 182 280 170 326 L244 326 L236 170Z" fill="#a38ae0"/>
        <path d="M88 226 C82 256 84 282 92 304 M200 226 C206 256 204 282 196 304 M108 250 C106 276 108 292 114 306 M180 250 C182 276 180 292 174 306" fill="none" stroke="#8f76cc" stroke-width="2.2"/>
      </g>
    </g>
  </g>

  <g id="L-body">
    <!-- 망토 -->
    <use href="#cape" fill="#463489" stroke="#2a2058" stroke-width="4.6"/>
    <path d="M78 316 C88 310 96 314 100 322 M210 316 C200 310 192 314 188 322" fill="none" stroke="#ffe27a" stroke-width="3"/>
    <!-- 신발 -->
    <use href="#boot" fill="#3c2f7a" stroke="#1f1848" stroke-width="4"/>
    <use href="#boot" fill="#3c2f7a" stroke="#1f1848" stroke-width="4" transform="translate(288 0) scale(-1 1)"/>
    <!-- 로브 -->
    <use href="#robe" fill="url(#robeG)"/>
    <g clip-path="url(#c-robe)">
      <path d="M152 232 C170 264 176 296 168 328 L204 328 L204 232Z" fill="#4f38a0" opacity=".8"/>
      <ellipse cx="144" cy="240" rx="34" ry="13" fill="#4a3498"/>
      <path d="M90 308 C112 320 176 320 198 308" fill="none" stroke="#ffe27a" stroke-width="5"/>
      <use href="#star" fill="#ffe27a" transform="translate(116 296) scale(.8)"/>
      <use href="#star" fill="#ffe27a" transform="translate(144 300) scale(.8)"/>
      <use href="#star" fill="#ffe27a" transform="translate(172 296) scale(.8)"/>
      <path d="M144 256 V292" stroke="#4a3498" stroke-width="3" fill="none"/>
      <path d="M112 266 C114 282 110 298 104 312" fill="none" stroke="#8f76e8" stroke-width="2.4"/>
    </g>
    <use href="#robe" fill="none" stroke="#2f2168" stroke-width="4.6"/>
    <!-- 왼팔: 넓은 소매 -->
    <path d="M122 242 C102 248 90 268 86 290 C94 298 108 298 116 290 C116 274 122 262 132 256Z" fill="#6a4fc4" stroke="#2f2168" stroke-width="4"/>
    <path d="M88 286 C96 292 108 292 116 286" fill="none" stroke="#ffe27a" stroke-width="3.2"/>
    <circle cx="101" cy="298" r="8.5" fill="#ffe3cf" stroke="#a8644e" stroke-width="3.2"/>
    <!-- 달 지팡이 -->
    <path d="M204 332 L250 222" fill="none" stroke="#5e3d1e" stroke-width="9"/>
    <path d="M204 332 L250 222" fill="none" stroke="#b07a48" stroke-width="5"/>
    <circle cx="254" cy="202" r="34" fill="url(#glowG)"/>
    <path d="M262 180 C242 178 230 194 234 210 C238 226 256 232 270 222 C256 224 246 214 246 202 C246 192 252 184 262 180Z" fill="#ffe27a" stroke="#b5861e" stroke-width="3.2"/>
    <path d="M242 198 C242 190 248 184 254 182" fill="none" stroke="#fff" stroke-width="2.4" opacity=".8"/>
    <use href="#star" fill="#fff6c2" stroke="#e0a83a" stroke-width="1.2" transform="translate(272 196) scale(.9)"/>
    <use href="#star" fill="#fff6c2" stroke="#e0a83a" stroke-width="1.2" transform="translate(278 230) scale(.6)"/>
    <!-- 오른팔 -->
    <path d="M166 242 C186 246 204 258 216 276 C212 286 204 292 194 292 C188 278 176 266 158 258Z" fill="#6a4fc4" stroke="#2f2168" stroke-width="4"/>
    <path d="M197 290 C205 286 211 280 214 273" fill="none" stroke="#ffe27a" stroke-width="3.2"/>
    <circle cx="214" cy="288" r="8.5" fill="#ffe3cf" stroke="#a8644e" stroke-width="3.2"/>
    <!-- 깃과 초승달 브로치 -->
    <path d="M118 242 C128 254 160 254 170 242 C164 262 150 266 144 266 C138 266 124 262 118 242Z" fill="#463489" stroke="#2a2058" stroke-width="3.2"/>
    <path d="M148 250 C141 250 137 256 139 261 C141 266 148 267 152 263 C147 264 144 260 144 257 C144 254 146 251 148 250Z" fill="#ffe27a" stroke="#b5861e" stroke-width="1.6"/>
  </g>

  <g id="L-head">
    <g transform="translate(144 244) scale(1.18) translate(-144 -244)">
      <use href="#face" fill="#ffe6d4"/>
      <g clip-path="url(#c-face)">
        <use href="#bang" fill="#f2c3ab" transform="translate(0 8)"/>
        <path d="M82 214 C104 246 184 246 206 214 V250 H82Z" fill="#f9d2bd" opacity=".7"/>
      </g>
      <use href="#face" fill="none" stroke="#a8644e" stroke-width="4"/>
      <g id="eyes-open">
        <use href="#eye" transform="translate(119 200)"/>
        <use href="#eye" transform="translate(169 200)"/>
        <use href="#lash" transform="translate(119 200) scale(-1 1)"/>
        <use href="#lash" transform="translate(169 200)"/>
      </g>
      <g id="eyes-closed" display="none">
        <use href="#lid" transform="translate(119 203) scale(-1 1)"/>
        <use href="#lid" transform="translate(169 203)"/>
      </g>
      <ellipse cx="99" cy="218" rx="11" ry="6" fill="#ff8fa3" opacity=".5"/>
      <ellipse cx="189" cy="218" rx="11" ry="6" fill="#ff8fa3" opacity=".5"/>
      <path d="M93 220 l3 -5 M98 221 l3 -5 M103 221 l3 -5 M183 221 l3 -5 M188 221 l3 -5 M193 220 l3 -5" stroke="#e86a84" stroke-width="1.4" fill="none"/>
      <!-- 고양이 입 -->
      <path d="M134 221 Q139 227 144 222 Q149 227 154 221" fill="none" stroke="#8a2f45" stroke-width="2.8"/>
      <!-- 옆머리·앞머리 -->
      <use href="#lock" fill="#cdb8ff" stroke="#5d4a96" stroke-width="4"/>
      <use href="#lock" fill="#bea8f4" stroke="#5d4a96" stroke-width="4" transform="translate(288 0) scale(-1 1)"/>
      <use href="#bang" fill="#cdb8ff"/>
      <g clip-path="url(#c-bang)">
        <path d="M70 120 H218 V164 C190 174 98 174 70 164Z" fill="#a892e6"/>
        <path d="M100 176 C120 172 136 162 146 150" fill="none" stroke="#e9deff" stroke-width="4" opacity=".8"/>
      </g>
      <use href="#bang" fill="none" stroke="#5d4a96" stroke-width="4"/>
      <path d="M164 164 C172 170 184 174 192 174 M118 168 C114 174 108 180 100 184" fill="none" stroke="#8f76cc" stroke-width="2"/>
      <!-- 마녀 모자 -->
      <g transform="rotate(-7 144 150)">
        <ellipse cx="144" cy="152" rx="98" ry="19" fill="#2a2458" stroke="#1c1840" stroke-width="4.6"/>
        <ellipse cx="144" cy="148" rx="96" ry="16" fill="url(#hatG)"/>
        <path d="M60 144 C80 136 110 132 140 132" fill="none" stroke="#7a70c8" stroke-width="3" opacity=".7"/>
        <use href="#cone" fill="url(#hatG)"/>
        <g clip-path="url(#c-cone)">
          <path d="M150 40 C176 80 190 120 200 152 L214 152 L214 40Z" fill="#221c4c" opacity=".55"/>
          <path d="M112 132 C118 104 132 82 150 66" fill="none" stroke="#8a80d8" stroke-width="5" opacity=".6"/>
          <path d="M92 150 C104 128 186 128 198 150 V160 H92Z" fill="#ffe27a"/>
          <path d="M92 150 C104 128 186 128 198 150" fill="none" stroke="#b5861e" stroke-width="3"/>
          <use href="#star" fill="#ffe27a" transform="translate(150 96) scale(.9)"/>
          <use href="#star" fill="#ffe27a" transform="translate(170 118) scale(.55)"/>
          <use href="#star" fill="#ffe27a" transform="translate(128 114) scale(.5)"/>
        </g>
        <use href="#cone" fill="none" stroke="#1c1840" stroke-width="4.6"/>
        <path d="M146 134 C137 134 132 142 135 149 C138 156 148 157 153 151 C146 153 142 148 142 143 C142 139 144 136 146 134Z" fill="#fff6c2" stroke="#b5861e" stroke-width="2"/>
        <circle cx="204" cy="64" r="5" fill="#ffe27a" stroke="#b5861e" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
