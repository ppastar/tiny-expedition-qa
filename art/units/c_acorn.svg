    <circle cx="230" cy="240" r="8.5" fill="#f6cfae" stroke="#9a5a3e" stroke-width="3"/>
    <!-- 목도리 -->
    <path d="M158 252 l16 22 l-13 -3 l-7 -12z" fill="#d9ad4a" stroke="#8a6a1e" stroke-width="3"/>
    <path d="M116 242 C130 256 158 256 172 242 C172 254 160 263 144 263 C128 263 116 254 116 242Z" fill="#f0cf78" stroke="#8a6a1e" stroke-width="3.2"/>
    <path d="M128 252 q2 5 0 8 M144 255 v7 M160 252 q-2 5 0 8" stroke="#c99a3a" stroke-width="2" fill="none"/>
  </g>

  <g id="L-head">
