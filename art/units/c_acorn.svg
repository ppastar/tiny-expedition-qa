      <path d="M132 217 Q146 233 158 215 Z" fill="#fff" stroke="#7a3a2a" stroke-width="2.2"/>
      <path d="M137 221 Q146 226 154 219" fill="none" stroke="#d9a090" stroke-width="1.4"/>
      <!-- 옆머리·앞머리 -->
      <path d="M83 176 C76 196 80 212 89 224 C91 208 93 192 94 180 Z" fill="#9a6238" stroke="#4e2c14" stroke-width="3.2"/>
      <path d="M205 176 C212 196 208 212 199 224 C197 208 195 192 194 180 Z" fill="#8a5630" stroke="#4e2c14" stroke-width="3.2"/>
      <use href="#bang" fill="#a2683c"/>
      <g clip-path="url(#c-bang)">
