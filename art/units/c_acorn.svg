    <linearGradient id="irisG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a10"/><stop offset=".55" stop-color="#8a5526"/><stop offset="1" stop-color="#e0a45a"/></linearGradient>
    <linearGradient id="coneG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b98252"/><stop offset="1" stop-color="#7d4e2c"/></linearGradient>
