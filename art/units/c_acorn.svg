<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 352" data-ppu="176" data-neck="144 244" stroke-linejoin="round" stroke-linecap="round">
  <!-- 도토리 정찰병: 갈색 짧은 머리, 도토리 깍정이 모자, 초록 옷과 노란 목도리, 솔방울 -->
  <defs>
