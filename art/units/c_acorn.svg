            <path d="M60 104 q14 12 28 0 q14 12 28 0 q14 12 28 0 q14 12 28 0 q14 12 28 0 q14 12 28 0"/>
            <path d="M46 122 q14 12 28 0 q14 12 28 0 q14 12 28 0 q14 12 28 0 q14 12 28 0 q14 12 28 0 q14 12 28 0"/>
            <path d="M88 88 q14 12 28 0 q14 12 28 0 q14 12 28 0 q14 12 28 0"/>
            <path d="M60 140 q14 12 28 0 q14 12 28 0 q14 12 28 0 q14 12 28 0 q14 12 28 0 q14 12 28 0"/>
          </g>
          <path d="M150 80 C196 86 226 116 222 160 L190 164 Z" fill="#5a3418" opacity=".3"/>
          <path d="M84 116 C92 100 108 90 126 88" fill="none" stroke="#fff" stroke-width="6" opacity=".3"/>
        </g>
        <use href="#cap" fill="none" stroke="#4e2c14" stroke-width="4.4"/>
        <path d="M66 148 C90 162 198 162 222 148 C225 157 221 163 216 166 C190 175 98 175 72 166 C67 163 63 157 66 148Z" fill="#a8744a" stroke="#4e2c14" stroke-width="4"/>
        <path d="M84 162 l-1 6 M108 166 l0 6 M132 168 l0 6 M156 168 l0 6 M180 166 l0 6 M204 162 l1 6" stroke="#7d4e2c" stroke-width="2" fill="none"/>
