      </g>
      <use href="#face" fill="none" stroke="#9a5a3e" stroke-width="3.6"/>
      <g id="eyes-open">
        <use href="#eye" transform="translate(119 199)"/>
        <use href="#eye" transform="translate(169 199)"/>
        <use href="#lash" transform="translate(119 199)"/>
        <use href="#lash" transform="translate(169 199) scale(-1 1)"/>
      </g>
      <g id="eyes-closed" display="none">
        <path d="M106 198 Q119 210 132 198 M156 198 Q169 210 182 198" fill="none" stroke="#3a2430" stroke-width="4.6"/>
      </g>
