      <path d="M105 181 L131 178 M183 181 L157 178" stroke="#5a3418" stroke-width="4.4" fill="none"/>
      <!-- 볼·주근깨·입 -->
      <ellipse cx="99" cy="217" rx="10" ry="5.5" fill="#ff8f7a" opacity=".5"/>
      <ellipse cx="189" cy="217" rx="10" ry="5.5" fill="#ff8f7a" opacity=".5"/>
      <path d="M94 219 l3 -5 M99 220 l3 -5 M184 220 l3 -5 M189 219 l3 -5" stroke="#e0705a" stroke-width="1.4" fill="none"/>
