    <path id="backhair" d="M76 180 C72 140 100 116 144 116 C188 116 216 140 212 180 C214 206 208 224 200 238 L192 228 L186 240 L176 230 L112 230 L102 240 L96 228 L88 238 C80 224 74 206 76 180Z"/>
    <path id="boot" d="M122 316 h20 v13 a7 7 0 0 1 -7 7 h-13 a7 7 0 0 1 -7 -7 v-1 a9 9 0 0 1 7 -12z"/>
    <clipPath id="c-cap"><use href="#cap"/></clipPath>
    <clipPath id="c-tunic"><use href="#tunic"/></clipPath>
    <clipPath id="c-face"><use href="#face"/></clipPath>
    <clipPath id="c-bang"><use href="#bang"/></clipPath>
    <clipPath id="c-cone"><ellipse cx="0" cy="0" rx="14" ry="19"/></clipPath>
    <g id="eye">
